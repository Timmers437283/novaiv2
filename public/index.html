```html
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>NovaIV2</title>

	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		:root {
			--bg: #0a0a0a;
			--surface: #111111;
			--surface-hover: #171717;
			--border: #242424;
			--text: #f5f5f5;
			--muted: #8a8a8a;
			--user: #252525;
			--accent: #ffffff;
		}

		html,
		body {
			width: 100%;
			height: 100%;
		}

		body {
			font-family:
				-apple-system,
				BlinkMacSystemFont,
				"Segoe UI",
				Roboto,
				Helvetica,
				Arial,
				sans-serif;
			background: var(--bg);
			color: var(--text);
			overflow: hidden;
		}

		.app {
			height: 100vh;
			display: flex;
			flex-direction: column;
		}

		/* Header */

		header {
			height: 64px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0 24px;
			border-bottom: 1px solid var(--border);
			background: rgba(10, 10, 10, 0.92);
			backdrop-filter: blur(12px);
			flex-shrink: 0;
		}

		.logo {
			display: flex;
			align-items: center;
			gap: 10px;
			font-size: 17px;
			font-weight: 600;
			letter-spacing: -0.3px;
		}

		.logo-mark {
			width: 30px;
			height: 30px;
			border-radius: 9px;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #fff;
			color: #000;
			font-size: 14px;
			font-weight: 800;
		}

		.model {
			font-size: 12px;
			color: var(--muted);
			padding: 6px 10px;
			border: 1px solid var(--border);
			border-radius: 8px;
		}

		/* Chat */

		.chat-container {
			flex: 1;
			min-height: 0;
			display: flex;
			flex-direction: column;
			width: 100%;
			max-width: 900px;
			margin: 0 auto;
		}

		.chat-messages {
			flex: 1;
			overflow-y: auto;
			padding: 32px 24px 140px;
			scroll-behavior: smooth;
		}

		.chat-messages::-webkit-scrollbar {
			width: 6px;
		}

		.chat-messages::-webkit-scrollbar-track {
			background: transparent;
		}

		.chat-messages::-webkit-scrollbar-thumb {
			background: #2b2b2b;
			border-radius: 20px;
		}

		.message {
			width: fit-content;
			max-width: min(75%, 680px);
			margin-bottom: 20px;
			animation: messageIn 0.2s ease-out;
		}

		@keyframes messageIn {
			from {
				opacity: 0;
				transform: translateY(5px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.message p {
			white-space: pre-line;
			overflow-wrap: anywhere;
			line-height: 1.65;
			font-size: 15px;
		}

		.user-message {
			margin-left: auto;
			background: var(--user);
			padding: 12px 16px;
			border-radius: 18px 18px 5px 18px;
		}

		.assistant-message {
			margin-right: auto;
			padding: 4px 0;
		}

		/* Typing */

		.typing-indicator {
			display: none;
			padding: 0 24px 12px;
			color: var(--muted);
			font-size: 13px;
		}

		.typing-indicator.visible {
			display: block;
		}

		.typing-dots {
			display: inline-flex;
			gap: 4px;
			margin-left: 4px;
		}

		.typing-dots span {
			width: 4px;
			height: 4px;
			border-radius: 50%;
			background: var(--muted);
			animation: pulse 1.2s infinite;
		}

		.typing-dots span:nth-child(2) {
			animation-delay: 0.15s;
		}

		.typing-dots span:nth-child(3) {
			animation-delay: 0.3s;
		}

		@keyframes pulse {
			0%, 60%, 100% {
				opacity: 0.3;
			}
			30% {
				opacity: 1;
			}
		}

		/* Input */

		.input-area {
			position: fixed;
			left: 0;
			right: 0;
			bottom: 0;
			padding: 16px 20px 20px;
			background: linear-gradient(
				to bottom,
				transparent,
				var(--bg) 25%
			);
		}

		.message-input {
			display: flex;
			align-items: flex-end;
			gap: 8px;
			width: 100%;
			max-width: 760px;
			margin: 0 auto;
			padding: 8px;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 17px;
			box-shadow: 0 8px 35px rgba(0, 0, 0, 0.35);
			transition: border-color 0.2s, box-shadow 0.2s;
		}

		.message-input:focus-within {
			border-color: #3a3a3a;
			box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
		}

		#user-input {
			flex: 1;
			min-height: 42px;
			max-height: 180px;
			padding: 10px 12px;
			border: none;
			outline: none;
			resize: none;
			background: transparent;
			color: var(--text);
			font: inherit;
			font-size: 15px;
			line-height: 1.5;
		}

		#user-input::placeholder {
			color: #666;
		}

		#send-button {
			width: 42px;
			height: 42px;
			flex-shrink: 0;
			border: none;
			border-radius: 12px;
			background: var(--accent);
			color: #000;
			cursor: pointer;
			font-size: 18px;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: transform 0.15s, opacity 0.15s;
		}

		#send-button:hover {
			transform: scale(1.04);
		}

		#send-button:active {
			transform: scale(0.96);
		}

		#send-button:disabled {
			opacity: 0.35;
			cursor: not-allowed;
			transform: none;
		}

		.send-icon {
			width: 17px;
			height: 17px;
			border-top: 2px solid currentColor;
			border-right: 2px solid currentColor;
			transform: rotate(-45deg) translate(-1px, 1px);
		}

		.disclaimer {
			text-align: center;
			font-size: 11px;
			color: #555;
			margin-top: 9px;
		}

		/* Mobile */

		@media (max-width: 600px) {
			header {
				height: 58px;
				padding: 0 16px;
			}

			.logo {
				font-size: 16px;
			}

			.logo-mark {
				width: 28px;
				height: 28px;
			}

			.model {
				display: none;
			}

			.chat-messages {
				padding: 24px 16px 130px;
			}

			.message {
				max-width: 88%;
			}

			.message p {
				font-size: 14px;
			}

			.input-area {
				padding: 12px 12px 14px;
			}

			.message-input {
				border-radius: 15px;
			}
		}
	</style>
</head>

<body>
	<div class="app">

		<header>
			<div class="logo">
				<div class="logo-mark">N</div>
				<span>NovaIV2</span>
			</div>

			<div class="model">
				AI Chat
			</div>
		</header>

		<div class="chat-container">

			<div id="chat-messages" class="chat-messages">
				<div class="message assistant-message">
					<p>Hello! I'm NovaIV2. How can I help you today?</p>
				</div>
			</div>

			<div class="typing-indicator" id="typing-indicator">
				NovaIV2 is thinking
				<span class="typing-dots">
					<span></span>
					<span></span>
					<span></span>
				</span>
			</div>

		</div>

		<div class="input-area">
			<div class="message-input">
				<textarea
					id="user-input"
					placeholder="Message NovaIV2..."
					rows="1"
					autofocus
				></textarea>

				<button id="send-button" aria-label="Send message">
					<span class="send-icon"></span>
				</button>
			</div>

			<div class="disclaimer">
				NovaIV2 can make mistakes. Check important information.
			</div>
		</div>

	</div>

	<script src="chat.js"></script>

	<script>
		const input = document.getElementById("user-input");

		input.addEventListener("input", () => {
			input.style.height = "auto";
			input.style.height = Math.min(input.scrollHeight, 180) + "px";
		});

		input.addEventListener("keydown", (event) => {
			if (event.key === "Enter" && !event.shiftKey) {
				event.preventDefault();

				const button = document.getElementById("send-button");

				if (!button.disabled) {
					button.click();
				}
			}
		});
	</script>
</body>
</html>
